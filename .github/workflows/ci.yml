name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build M96 Control.app
        run: bash scripts/build-app.sh

      - name: Verify bundle
        run: |
          codesign --verify --deep "M96 Control.app"
          file "M96 Control.app/Contents/MacOS/M96Control" | grep -q arm64

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: M96-Control-macOS
          path: "M96 Control.app"
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: M96-Control-macOS

      - name: Zip app bundle
        run: |
          ditto -c -k --keepParent "M96 Control.app" M96-Control-macOS.zip
          shasum -a 256 M96-Control-macOS.zip > M96-Control-macOS.zip.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            M96-Control-macOS.zip
            M96-Control-macOS.zip.sha256
          generate_release_notes: true
